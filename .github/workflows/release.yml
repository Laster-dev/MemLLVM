name: Automated Release Build

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Flat Binaries
    if: |
      contains(github.event.head_commit.message, 'release') ||
      contains(github.event.head_commit.message, 'Release') ||
      contains(github.ref, 'release') ||
      contains(github.ref, 'Release')
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Release Artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            "release_artifacts/MemLLVM.dll",
            "release_artifacts/box2d.bin",
            "release_artifacts/chip8.bin",
            "release_artifacts/doom.bin",
            "release_artifacts/doom1.wad",
            "release_artifacts/imgui_demo.bin",
            "Tools/SCLoader.exe"
          )
          Write-Host "=========================================================="
          Write-Host "       MemLLVM Release Artifacts Verification Matrix       "
          Write-Host "=========================================================="
          $allValid = $true
          foreach ($item in $artifacts) {
            if (Test-Path $item) {
              $size = (Get-Item $item).Length / 1024.0
              $hash = (Get-FileHash -Path $item -Algorithm SHA256).Hash.Substring(0, 16)
              Write-Host ("[+] VALID : {0,-36} ({1,8:F2} KB) [SHA256: {2}...]" -f $item, $size, $hash)
            } else {
              Write-Host ("[-] MISSING: {0}" -f $item) -ForegroundColor Red
              $allValid = $false
            }
          }
          if (-not $allValid) {
            throw "One or more required release artifacts are missing!"
          }
          Write-Host "=========================================================="
          Write-Host "[+] All release artifacts verified successfully."

      - name: Package SDK Distribution Archive
        shell: pwsh
        run: |
          $sdk = "MemLLVM-SDK"
          if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
          New-Item -ItemType Directory -Path "$sdk/bin" -Force
          New-Item -ItemType Directory -Path "$sdk/lib" -Force
          New-Item -ItemType Directory -Path "$sdk/include" -Force
          New-Item -ItemType Directory -Path "$sdk/ltl" -Force
          New-Item -ItemType Directory -Path "$sdk/Tools" -Force
          New-Item -ItemType Directory -Path "$sdk/src" -Force
          New-Item -ItemType Directory -Path "$sdk/examples" -Force

          # 1. bin & lib
          Copy-Item "release_artifacts/MemLLVM.dll" "$sdk/bin/" -Force
          if (Test-Path "build/MemLLVM/Release/MemLLVM.lib") {
            Copy-Item "build/MemLLVM/Release/MemLLVM.lib" "$sdk/lib/" -Force
          }

          # 2. include
          Copy-Item "MemLLVM/*.h" "$sdk/include/" -Force

          # 3. LTL runtime
          Copy-Item -Recurse "ltl/*" "$sdk/ltl/" -Force

          # 4. Tools (SCLoader GUI runner)
          Copy-Item "Tools/SCLoader.exe" "$sdk/Tools/" -Force

          # 5. Full Source Code & Setup Scripts
          Copy-Item -Recurse "MemLLVM/*" "$sdk/src/" -Force
          Copy-Item "CMakeLists.txt" "$sdk/" -Force
          Copy-Item "readme.md" "$sdk/" -Force
          Copy-Item "setup_env.bat" "$sdk/" -Force
          Copy-Item "setup_env.ps1" "$sdk/" -Force

          # 6. Examples
          Copy-Item -Recurse "examples/*" "$sdk/examples/" -Force

          # 7. Compress into SDK zip package
          Compress-Archive -Path "$sdk/*" -DestinationPath "MemLLVM-SDK-windows-x64.zip" -Force
          Write-Host "[+] Created MemLLVM-SDK-windows-x64.zip ($((Get-Item 'MemLLVM-SDK-windows-x64.zip').Length / 1024.0) KB)"

      - name: Package Tests Distribution Archive
        shell: pwsh
        run: |
          $tempDir = "temp_tests_pkg/tests"
          if (Test-Path "temp_tests_pkg") { Remove-Item -Recurse -Force "temp_tests_pkg" }
          New-Item -ItemType Directory -Path $tempDir -Force

          $files = Get-ChildItem "tests" -File | Where-Object { 
            $_.Extension -in @(".cpp", ".c", ".bin", ".bat", ".h", ".txt") -and
            $_.Name -notmatch '\.ll$' -and $_.Name -notmatch '\.pcm$'
          }

          foreach ($f in $files) {
            Copy-Item $f.FullName -Destination $tempDir -Force
          }

          Compress-Archive -Path "temp_tests_pkg/*" -DestinationPath "MemLLVM-Tests.zip" -Force
          Remove-Item -Recurse -Force "temp_tests_pkg"
          Write-Host "[+] Created MemLLVM-Tests.zip ($([math]::Round((Get-Item 'MemLLVM-Tests.zip').Length / 1024.0, 2)) KB)"

      - name: Generate Release Tag & Date
        id: release_info
        shell: pwsh
        run: |
          $dateTag = Get-Date -Format "yyyy.MM.dd"
          $tag = "v${dateTag}"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "date=$dateTag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "MemLLVM Official Release ${{ steps.release_info.outputs.date }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          body: |
            ## MemLLVM Official Release (Full SDK & Binaries)

            Compiled with **LLVM/Clang New Pass Manager** and **LTL Freestanding Runtime**.
            All application targets are standalone, self-relocating flat machine code images (.bin) runnable in memory.

            ### Release Assets:
            - **`MemLLVM-SDK-windows-x64.zip`**: Complete SDK archive containing:
              - `setup_env.bat`: One-click environment variable setup & auto-updater (detects current directory, sets `MEMLLVM_DIR` and updates `PATH`; automatically migrates old paths on repeated runs in new locations)
              - `bin/`: `MemLLVM.dll` LLVM Pass Plugin
              - `lib/`: `MemLLVM.lib` import library
              - `include/`: Pass headers & API definitions
              - `ltl/`: Freestanding C/C++ runtime headers and `ltl.lib`
              - `Tools/`: `SCLoader.exe` interactive GUI payload runner & debugger
              - `src/`: Complete C++ source code of all LLVM passes
              - `examples/`: Box2D, CHIP-8, DOOM, ImGui full example projects
            - **`MemLLVM-Tests.zip`**: Representative modern C and C++ test suite containing source `.cpp` files, compiled `.bin` flat binaries, batch verification scripts, and test assets
            - **`Tools/SCLoader.exe`**: Modern CUI-based GUI Shellcode & Payload Loader
            - **`box2d.bin`**: Erin Catto's Box2D 2D Rigid Body Physics Engine Flat Binary
            - **`chip8.bin`**: Full CHIP-8 CPU / Sound Virtual Machine Flat Binary
            - **`doom.bin`**: Classic DOOM Game Engine Flat Binary
            - **`doom1.wad`**: DOOM Shareware Game Data IWAD
            - **`imgui_demo.bin`**: Dear ImGui DirectX 11 Immediate-Mode GUI Flat Binary
          files: |
            MemLLVM-SDK-windows-x64.zip
            MemLLVM-Tests.zip
            Tools/SCLoader.exe
            release_artifacts/box2d.bin
            release_artifacts/chip8.bin
            release_artifacts/doom.bin
            release_artifacts/doom1.wad
            release_artifacts/imgui_demo.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
