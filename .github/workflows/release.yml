name: Automated Release Build

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Flat Binaries
    if: |
      contains(github.event.head_commit.message, 'release') ||
      contains(github.event.head_commit.message, 'Release') ||
      contains(github.ref, 'release') ||
      contains(github.ref, 'Release')
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Release Artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            "release_artifacts/MemLLVM.dll",
            "release_artifacts/run_bin.exe",
            "release_artifacts/box2d.bin",
            "release_artifacts/chip8.bin",
            "release_artifacts/doom.bin",
            "release_artifacts/doom1.wad",
            "release_artifacts/imgui_demo.bin",
            "release_artifacts/scintilla_editor.bin"
          )
          Write-Host "=========================================================="
          Write-Host "       MemLLVM Release Artifacts Verification Matrix       "
          Write-Host "=========================================================="
          $allValid = $true
          foreach ($item in $artifacts) {
            if (Test-Path $item) {
              $size = (Get-Item $item).Length / 1024.0
              $hash = (Get-FileHash -Path $item -Algorithm SHA256).Hash.Substring(0, 16)
              Write-Host ("[+] VALID : {0,-36} ({1,8:F2} KB) [SHA256: {2}...]" -f $item, $size, $hash)
            } else {
              Write-Host ("[-] MISSING: {0}" -f $item) -ForegroundColor Red
              $allValid = $false
            }
          }
          if (-not $allValid) {
            throw "One or more required release artifacts are missing from release_artifacts/!"
          }
          Write-Host "=========================================================="
          Write-Host "[+] All 8 release artifacts verified successfully."

      - name: Generate Release Tag & Date
        id: release_info
        shell: pwsh
        run: |
          $dateTag = Get-Date -Format "yyyy.MM.dd"
          $tag = "v${dateTag}"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "date=$dateTag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "MemLLVM Automated Release ${{ steps.release_info.outputs.date }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          body: |
            ## MemLLVM Official Binary Release

            Compiled with **LLVM/Clang New Pass Manager** and **LTL Freestanding Runtime**.
            All application targets are standalone, self-relocating flat machine code images (.bin) runnable in memory via `run_bin.exe`.

            ### Release Assets:
            - **`MemLLVM.dll`**: LLVM Compiler Pass Plugin (Windows x64)
            - **`run_bin.exe`**: In-Memory Flat Machine Code Loader & Harness
            - **`box2d.bin`**: Erin Catto's Box2D 2D Rigid Body Physics Engine Flat Binary
            - **`chip8.bin`**: Full CHIP-8 CPU / Sound Virtual Machine Flat Binary
            - **`doom.bin`**: Classic DOOM Game Engine Flat Binary
            - **`doom1.wad`**: DOOM Shareware Game Data IWAD
            - **`imgui_demo.bin`**: Dear ImGui DirectX 11 Immediate-Mode GUI Flat Binary
            - **`scintilla_editor.bin`**: Scintilla Native Win32 Code Editor Flat Binary
          files: |
            release_artifacts/MemLLVM.dll
            release_artifacts/run_bin.exe
            release_artifacts/box2d.bin
            release_artifacts/chip8.bin
            release_artifacts/doom.bin
            release_artifacts/doom1.wad
            release_artifacts/imgui_demo.bin
            release_artifacts/scintilla_editor.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
