name: Automated Release Build

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: build the mimikatz flat binary from source on the runner.
  # Requires: the precommitted MemLLVM.dll plugin, the pinned
  # plugin-compatible clang toolchain (release_artifacts/
  # clang-plugin-toolchain.zip), ltl/ltl.lib and
  # examples/mimikatz/lib/x64/*.lib.
  # ------------------------------------------------------------------
  build-mimikatz:
    name: Build mimikatz Flat Binary
    if: |
      contains(github.event.head_commit.message, 'release') ||
      contains(github.event.head_commit.message, 'Release') ||
      contains(github.ref, 'release') ||
      contains(github.ref, 'Release')
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Unpack Pinned Plugin-Compatible LLVM Toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The MemLLVM pass plugin is statically linked against a private
          # LLVM build. Official LLVM release binaries are NOT C++-ABI
          # compatible with it: the plugin registers but the first pass run
          # dies with STATUS_HEAP_CORRUPTION (0xC0000374). Verified locally:
          # same 22.1.8 commit from the official NSIS installer crashes,
          # the pinned dev build works. So ship the exact clang-cl.exe plus
          # builtin headers the plugin was built against, committed at
          # release_artifacts/clang-plugin-toolchain.zip (~38 MB, layout:
          # bin/clang-cl.exe + lib/clang/22/include).
          $dest = "C:\LLVM-22-plugin"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path "release_artifacts/clang-plugin-toolchain.zip" -DestinationPath $dest -Force
          $cc = Join-Path $dest "bin\clang-cl.exe"
          if (-not (Test-Path $cc)) { throw "clang-cl.exe missing after unpack" }
          if (-not (Test-Path (Join-Path $dest "lib\clang\22\include\stdint.h"))) { throw "builtin headers missing after unpack" }
          $v = & $cc --version | Select-Object -First 1
          Write-Host "[+] Toolchain: $v"
          if ($v -notlike "*22.1.8*") { throw "toolchain version mismatch: expected 22.1.8, got $v" }
          Add-Content $env:GITHUB_PATH (Join-Path $dest "bin")

      - name: Verify Plugin & Runtime Are Present
        shell: pwsh
        run: |
          foreach ($item in @("release_artifacts/MemLLVM.dll", "ltl/ltl.lib",
                              "examples/mimikatz/lib/x64/msasn1.min.lib",
                              "examples/mimikatz/build/build_vs_release.bat")) {
            if (-not (Test-Path $item)) { throw "Missing required input: $item" }
            Write-Host "[+] $item"
          }

      - name: Stage Plugin DLL at bin/ (MEMLLVM_DIR expects it there)
        shell: pwsh
        run: |
          # The pass plugin flag is -fpass-plugin="$(MEMLLVM_DIR)bin\MemLLVM.dll"
          # where MEMLLVM_DIR resolves to the repository root. Locally bin/ is a
          # build output; on the runner the precommitted plugin lives in
          # release_artifacts/, so stage a copy at the expected location.
          New-Item -ItemType Directory -Path "bin" -Force | Out-Null
          Copy-Item "release_artifacts/MemLLVM.dll" "bin/MemLLVM.dll" -Force
          Write-Host "[+] Staged bin/MemLLVM.dll ($((Get-Item 'bin/MemLLVM.dll').Length) bytes)"

      - name: Build mimikatz (114 TUs through the MemLLVM pass)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $proj = Join-Path $root "examples\mimikatz"
          # /p: overrides exist because Directory.Build.props carries local-machine
          # defaults: LLVMInstallDir (CI unpacks the pinned toolchain to
          # C:\LLVM-22-plugin) and MemLLVMPython (the runner's python is on
          # PATH). MEMLLVM_DIR is derived from the props file location, so no
          # override is needed.
          msbuild "examples\mimikatz\mimikatz\mimikatz.vcxproj" `
            /p:Configuration=Release /p:Platform=x64 `
            "/p:SolutionDir=$proj\" `
            "/p:LLVMInstallDir=C:\LLVM-22-plugin" `
            /p:MemLLVMPython=python `
            /m /v:m /nologo
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with $LASTEXITCODE" }

      - name: Verify Flat Binary
        shell: pwsh
        run: |
          $bin = "examples/mimikatz/x64/mimikatz_mllvm.bin"
          if (-not (Test-Path $bin)) { throw "Flat binary was not produced: $bin" }
          $size = (Get-Item $bin).Length
          Write-Host "[+] mimikatz_mllvm.bin: $size bytes"
          if ($size -lt 1MB) { throw "Flat binary suspiciously small ($size bytes)" }

      - name: Upload mimikatz Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimikatz_mllvm
          path: examples/mimikatz/x64/mimikatz_mllvm.bin
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Job 2: verify precommitted artifacts, package SDK/tests/CSLoader
  # source, and publish the GitHub release. Waits for the mimikatz
  # build so the fresh .bin lands in the same release.
  # ------------------------------------------------------------------
  release:
    name: Build & Release Flat Binaries
    needs: build-mimikatz
    if: |
      contains(github.event.head_commit.message, 'release') ||
      contains(github.event.head_commit.message, 'Release') ||
      contains(github.ref, 'release') ||
      contains(github.ref, 'Release')
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download mimikatz Flat Binary
        uses: actions/download-artifact@v4
        with:
          name: mimikatz_mllvm
          path: release_artifacts

      - name: Verify Release Artifacts
        shell: pwsh
        run: |
          $artifacts = @(
            "release_artifacts/MemLLVM.dll",
            "release_artifacts/mimikatz_mllvm.bin",
            "release_artifacts/box2d.bin",
            "release_artifacts/chip8.bin",
            "release_artifacts/doom.bin",
            "release_artifacts/doom1.wad",
            "release_artifacts/imgui_demo.bin",
            "Tools/SCLoader.exe"
          )
          Write-Host "=========================================================="
          Write-Host "       MemLLVM Release Artifacts Verification Matrix       "
          Write-Host "=========================================================="
          $allValid = $true
          foreach ($item in $artifacts) {
            if (Test-Path $item) {
              $size = (Get-Item $item).Length / 1024.0
              $hash = (Get-FileHash -Path $item -Algorithm SHA256).Hash.Substring(0, 16)
              Write-Host ("[+] VALID : {0,-36} ({1,8:F2} KB) [SHA256: {2}...]" -f $item, $size, $hash)
            } else {
              Write-Host ("[-] MISSING: {0}" -f $item) -ForegroundColor Red
              $allValid = $false
            }
          }
          if (-not $allValid) {
            throw "One or more required release artifacts are missing!"
          }
          Write-Host "=========================================================="
          Write-Host "[+] All release artifacts verified successfully."

      - name: Package SDK Distribution Archive
        shell: pwsh
        run: |
          $sdk = "MemLLVM-SDK"
          if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
          New-Item -ItemType Directory -Path "$sdk/bin" -Force
          New-Item -ItemType Directory -Path "$sdk/lib" -Force
          New-Item -ItemType Directory -Path "$sdk/include" -Force
          New-Item -ItemType Directory -Path "$sdk/ltl" -Force
          New-Item -ItemType Directory -Path "$sdk/Tools" -Force
          New-Item -ItemType Directory -Path "$sdk/src" -Force
          New-Item -ItemType Directory -Path "$sdk/examples" -Force

          # 1. bin & lib
          Copy-Item "release_artifacts/MemLLVM.dll" "$sdk/bin/" -Force
          if (Test-Path "ltl/ltl.lib") {
            Copy-Item "ltl/ltl.lib" "$sdk/lib/" -Force
          }
          if (Test-Path "build/MemLLVM/Release/MemLLVM.lib") {
            Copy-Item "build/MemLLVM/Release/MemLLVM.lib" "$sdk/lib/" -Force
          }

          # 2. include
          Copy-Item "MemLLVM/*.h" "$sdk/include/" -Force
          if (Test-Path "ltl/include") {
            Copy-Item -Recurse "ltl/include/*" "$sdk/include/" -Force
          }

          # 3. LTL runtime
          Copy-Item -Recurse "ltl/*" "$sdk/ltl/" -Force

          # 4. Tools (SCLoader GUI runner and flat binary extractor)
          Copy-Item "Tools/SCLoader.exe" "$sdk/Tools/" -Force
          if (Test-Path "Tools/extract_flat_bin.py") {
            Copy-Item "Tools/extract_flat_bin.py" "$sdk/Tools/" -Force
          }

          # 5. Full Source Code & Setup Scripts
          Copy-Item -Recurse "MemLLVM/*" "$sdk/src/" -Force
          if (Test-Path "Resolver.c") {
            Copy-Item "Resolver.c" "$sdk/src/" -Force
          }
          Copy-Item "CMakeLists.txt" "$sdk/" -Force
          Copy-Item "readme.md" "$sdk/" -Force
          Copy-Item "setup_env.bat" "$sdk/" -Force
          Copy-Item "setup_env.ps1" "$sdk/" -Force

          # 6. Examples (mimikatz source + MemLLVM build config included)
          Copy-Item -Recurse "examples/*" "$sdk/examples/" -Force

          # 7. Compress into SDK zip package
          Compress-Archive -Path "$sdk/*" -DestinationPath "MemLLVM-SDK-windows-x64.zip" -Force
          Write-Host "[+] Created MemLLVM-SDK-windows-x64.zip ($((Get-Item 'MemLLVM-SDK-windows-x64.zip').Length / 1024.0) KB)"

      - name: Package Tests Distribution Archive
        shell: pwsh
        run: |
          $tempDir = "temp_tests_pkg/tests"
          if (Test-Path "temp_tests_pkg") { Remove-Item -Recurse -Force $tempDir }
          New-Item -ItemType Directory -Path $tempDir -Force

          $files = Get-ChildItem "tests" -File | Where-Object {
            $_.Extension -in @(".cpp", ".c", ".bin", ".bat", ".h", ".txt") -and
            $_.Name -notmatch '\.ll$' -and $_.Name -notmatch '\.pcm$'
          }

          foreach ($f in $files) {
            Copy-Item $f.FullName -Destination $tempDir -Force
          }

          Compress-Archive -Path "temp_tests_pkg/*" -DestinationPath "MemLLVM-Tests.zip" -Force
          Remove-Item -Recurse -Force $tempDir
          Write-Host "[+] Created MemLLVM-Tests.zip ($([math]::Round((Get-Item 'MemLLVM-Tests.zip').Length / 1024.0, 2)) KB)"

      - name: Package CSLoader Source Archive
        shell: pwsh
        run: |
          # CSLoader ships as source only (no CI build): the CUI shellcode
          # loader project, built locally with VS. Strip the stale binary.
          $tempDir = "temp_csloader/CSLoader"
          if (Test-Path "temp_csloader") { Remove-Item -Recurse -Force "temp_csloader" }
          New-Item -ItemType Directory -Path $tempDir -Force
          Copy-Item "CSLoader/*.cpp" $tempDir -Force
          Copy-Item "CSLoader/*.h" $tempDir -Force
          Copy-Item "CSLoader/*.asm" $tempDir -Force
          Copy-Item "CSLoader/*.vcxproj" $tempDir -ErrorAction SilentlyContinue
          Copy-Item "CSLoader/*.sln" $tempDir -ErrorAction SilentlyContinue
          Compress-Archive -Path "temp_csloader/*" -DestinationPath "CSLoader-source.zip" -Force
          Remove-Item -Recurse -Force "temp_csloader"
          Write-Host "[+] Created CSLoader-source.zip ($([math]::Round((Get-Item 'CSLoader-source.zip').Length / 1024.0, 2)) KB)"

      - name: Generate Release Tag & Date
        id: release_info
        shell: pwsh
        run: |
          $dateTag = Get-Date -Format "yyyy.MM.dd"
          $tag = "v${dateTag}"
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "date=$dateTag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "MemLLVM Official Release ${{ steps.release_info.outputs.date }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          body: |
            ## MemLLVM Official Release (Full SDK & Binaries)

            Compiled with **LLVM/Clang New Pass Manager** and **LTL Freestanding Runtime**.
            All application targets are standalone, self-relocating flat machine code images (.bin) runnable in memory.

            ### Release Assets:
            - **`MemLLVM-SDK-windows-x64.zip`**: Complete SDK archive containing:
              - `setup_env.bat`: One-click environment variable setup & auto-updater (detects current directory, sets `MEMLLVM_DIR` and updates `PATH`; automatically migrates old paths on repeated runs in new locations)
              - `bin/`: `MemLLVM.dll` LLVM Pass Plugin
              - `lib/`: `MemLLVM.lib` import library and `ltl.lib` freestanding runtime
              - `include/`: Pass headers & API definitions
              - `ltl/`: Freestanding C/C++ runtime headers and `ltl.lib`
              - `Tools/`: `SCLoader.exe` interactive GUI payload runner & debugger
              - `src/`: Complete C++ source code of all LLVM passes
              - `examples/`: Box2D, CHIP-8, DOOM, ImGui, SQLite and **mimikatz** (with full MemLLVM VS build config) example projects
            - **`MemLLVM-Tests.zip`**: Representative modern C and C++ test suite containing source `.cpp` files, compiled `.bin` flat binaries, batch verification scripts, and test assets
            - **`mimikatz_mllvm.bin`**: mimikatz 2.2.0 built **from source on the release runner** through the MemLLVM pass (114 translation units), standalone flat image, interactive mode working under pipe-based loaders
            - **`CSLoader-source.zip`**: CUI shellcode loader (CSLoader) **source code only** — not built by CI; build locally with Visual Studio
            - **`Tools/SCLoader.exe`**: Modern CUI-based GUI Shellcode & Payload Loader
            - **`box2d.bin`**: Erin Catto's Box2D 2D Rigid Body Physics Engine Flat Binary
            - **`chip8.bin`**: Full CHIP-8 CPU / Sound Virtual Machine Flat Binary
            - **`doom.bin`**: Classic DOOM Game Engine Flat Binary
            - **`doom1.wad`**: DOOM Shareware Game Data IWAD
            - **`imgui_demo.bin`**: Dear ImGui DirectX 11 Immediate-Mode GUI Flat Binary
          files: |
            MemLLVM-SDK-windows-x64.zip
            MemLLVM-Tests.zip
            CSLoader-source.zip
            release_artifacts/mimikatz_mllvm.bin
            Tools/SCLoader.exe
            release_artifacts/box2d.bin
            release_artifacts/chip8.bin
            release_artifacts/doom.bin
            release_artifacts/doom1.wad
            release_artifacts/imgui_demo.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
